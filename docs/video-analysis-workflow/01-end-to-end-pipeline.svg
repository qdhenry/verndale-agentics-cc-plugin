<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1060" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3b82f6"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#059669"/>
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d97706"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7c3aed"/>
    </marker>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="phase0bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="phase1bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="phase2bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </linearGradient>
    <linearGradient id="phase3bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#f3e8ff"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="1060" fill="#f8fafc" rx="12"/>

  <!-- Title -->
  <text x="600" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Gap Analysis Agent Pipeline — End-to-End (Option F)</text>
  <text x="600" y="58" text-anchor="middle" font-size="13" fill="#64748b">Raw Video → Preprocessing → Frame Analysis → Migration Analysis → Confluence Export</text>

  <!-- ===== PHASE 0 — PREPROCESSING ===== -->
  <rect x="60" y="78" width="1080" height="140" rx="10" fill="url(#phase0bg)" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="600" y="98" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e" letter-spacing="1">PHASE 0 — PREPROCESSING (SEQUENTIAL)</text>

  <!-- Raw Video Input -->
  <rect x="82" y="112" width="140" height="52" rx="6" fill="#fff" stroke="#e5e7eb" filter="url(#shadow)"/>
  <text x="152" y="134" text-anchor="middle" font-size="10" font-weight="600" fill="#374151">Raw Video</text>
  <text x="152" y="150" text-anchor="middle" font-size="9" fill="#6b7280">.mp4 / .mov / .gif</text>

  <!-- Arrow to extractor -->
  <line x1="222" y1="138" x2="268" y2="138" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrow-amber)"/>

  <!-- Video Frame Extractor -->
  <rect x="280" y="110" width="210" height="56" rx="8" fill="#fff" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="385" y="132" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">Video Frame Extractor</text>
  <text x="385" y="148" text-anchor="middle" font-size="9" fill="#6b7280">extract-video-frames • ffmpeg</text>
  <text x="385" y="160" text-anchor="middle" font-size="8" fill="#6b7280">PNG frames + AAC audio + manifest</text>

  <!-- Arrow to transcriber -->
  <line x1="490" y1="138" x2="556" y2="138" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
  <text x="523" y="130" text-anchor="middle" font-size="8" font-weight="600" fill="#d97706">full_audio.aac</text>

  <!-- Audio Transcriber -->
  <rect x="568" y="110" width="210" height="56" rx="8" fill="#fff" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="673" y="132" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">Audio Transcriber</text>
  <text x="673" y="148" text-anchor="middle" font-size="9" fill="#6b7280">elevenlabs-transcribe • Scribe v2</text>
  <text x="673" y="160" text-anchor="middle" font-size="8" fill="#6b7280">Diarized transcript + key terms</text>

  <!-- Phase 0 Outputs -->
  <g transform="translate(830, 108)">
    <rect width="280" height="60" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="140" y="16" text-anchor="middle" font-size="9" font-weight="600" fill="#92400e">Phase 0 Outputs</text>
    <text x="140" y="30" text-anchor="middle" font-size="8" fill="#78716c">frame_NNN.png • manifest.json</text>
    <text x="140" y="42" text-anchor="middle" font-size="8" fill="#78716c">full_audio.aac • audio_NNN.aac</text>
    <text x="140" y="54" text-anchor="middle" font-size="8" fill="#78716c">audio-transcript.txt</text>
  </g>
  <line x1="778" y1="138" x2="828" y2="138" stroke="#d97706" stroke-width="1.2" marker-end="url(#arrow-amber)"/>

  <!-- ===== PHASE 1 — PARALLEL FRAME ANALYSIS ===== -->
  <rect x="60" y="236" width="700" height="290" rx="10" fill="url(#phase1bg)" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="410" y="256" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af" letter-spacing="1">PHASE 1 — PARALLEL FRAME ANALYSIS</text>

  <!-- Arrow from Phase 0 to Phase 1 -->
  <line x1="400" y1="218" x2="400" y2="234" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="400" y="230" text-anchor="middle" font-size="8" fill="#64748b">frames + manifest</text>

  <!-- Team Lead -->
  <rect x="330" y="268" width="160" height="38" rx="19" fill="#1e40af" filter="url(#shadow)"/>
  <text x="410" y="288" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Team Lead</text>
  <text x="410" y="300" text-anchor="middle" font-size="8" fill="#bfdbfe">delegate mode</text>

  <!-- Parallel Chunk Agents -->
  <rect x="80" y="318" width="660" height="14" rx="3" fill="#dbeafe" opacity="0.7"/>
  <text x="410" y="328" text-anchor="middle" font-size="8" font-weight="600" fill="#3b82f6">PARALLEL EXECUTION</text>

  <g transform="translate(82, 340)">
    <rect width="120" height="44" rx="5" fill="#fff" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="60" y="18" text-anchor="middle" font-size="9" font-weight="600" fill="#1e40af">Chunk 1</text>
    <text x="60" y="30" text-anchor="middle" font-size="8" fill="#6b7280">Frames 1–N</text>
    <text x="60" y="40" text-anchor="middle" font-size="7" fill="#6b7280">frame-analyst</text>
  </g>
  <g transform="translate(212, 340)">
    <rect width="120" height="44" rx="5" fill="#fff" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="60" y="18" text-anchor="middle" font-size="9" font-weight="600" fill="#1e40af">Chunk 2</text>
    <text x="60" y="30" text-anchor="middle" font-size="8" fill="#6b7280">Frames N+1–2N</text>
    <text x="60" y="40" text-anchor="middle" font-size="7" fill="#6b7280">frame-analyst</text>
  </g>
  <g transform="translate(342, 340)">
    <rect width="120" height="44" rx="5" fill="#fff" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="60" y="18" text-anchor="middle" font-size="9" font-weight="600" fill="#1e40af">Chunk 3</text>
    <text x="60" y="30" text-anchor="middle" font-size="8" fill="#6b7280">Frames 2N+1–3N</text>
    <text x="60" y="40" text-anchor="middle" font-size="7" fill="#6b7280">frame-analyst</text>
  </g>
  <g transform="translate(472, 340)">
    <rect width="120" height="44" rx="5" fill="#fff" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="60" y="18" text-anchor="middle" font-size="9" font-weight="600" fill="#1e40af">Chunk 4</text>
    <text x="60" y="30" text-anchor="middle" font-size="8" fill="#6b7280">Frames 3N+1–4N</text>
    <text x="60" y="40" text-anchor="middle" font-size="7" fill="#6b7280">frame-analyst</text>
  </g>
  <g transform="translate(602, 340)">
    <rect width="120" height="44" rx="5" fill="#fff" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="60" y="18" text-anchor="middle" font-size="9" font-weight="600" fill="#1e40af">Chunk 5</text>
    <text x="60" y="30" text-anchor="middle" font-size="8" fill="#6b7280">Frames 4N+1–end</text>
    <text x="60" y="40" text-anchor="middle" font-size="7" fill="#6b7280">frame-analyst</text>
  </g>

  <!-- Frame Synthesis -->
  <line x1="410" y1="384" x2="410" y2="406" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <rect x="290" y="410" width="240" height="48" rx="8" fill="#fff" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <text x="410" y="432" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">Frame Synthesis</text>
  <text x="410" y="448" text-anchor="middle" font-size="9" fill="#6b7280">Merge → Screen Catalog + Component Library + Arch Map</text>

  <!-- Synthesis outputs -->
  <g transform="translate(790, 280)">
    <rect width="260" height="90" rx="6" fill="#dbeafe" stroke="#93c5fd" filter="url(#shadow)"/>
    <text x="130" y="18" text-anchor="middle" font-size="9" font-weight="600" fill="#1e40af">Phase 1 Outputs</text>
    <text x="130" y="34" text-anchor="middle" font-size="8" fill="#6b7280">screen-catalog.md</text>
    <text x="130" y="48" text-anchor="middle" font-size="8" fill="#6b7280">component-library.md</text>
    <text x="130" y="62" text-anchor="middle" font-size="8" fill="#6b7280">system-architecture-map.md</text>
    <text x="130" y="78" text-anchor="middle" font-size="8" fill="#6b7280">frame-analysis-chunk-[1-5].md</text>
  </g>
  <line x1="530" y1="434" x2="788" y2="340" stroke="#3b82f6" stroke-width="1" marker-end="url(#arrow-blue)" stroke-dasharray="4,3"/>

  <!-- ===== PHASE 2 — MIGRATION ANALYSIS ===== -->
  <rect x="60" y="545" width="1080" height="260" rx="10" fill="url(#phase2bg)" stroke="#86efac" stroke-width="1.5"/>
  <text x="600" y="565" text-anchor="middle" font-size="12" font-weight="700" fill="#166534" letter-spacing="1">PHASE 2 — MIGRATION ANALYSIS TEAM</text>

  <!-- Arrow from Phase 1 to Phase 2 -->
  <line x1="410" y1="526" x2="410" y2="543" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Arrow from Phase 0 transcript to Phase 2 -->
  <path d="M673,168 L673,200 L80,200 L80,560 L80,560" stroke="#d97706" stroke-width="1" fill="none" stroke-dasharray="4,3"/>
  <text x="50" y="400" font-size="8" fill="#d97706" transform="rotate(-90 50 400)">transcript</text>

  <!-- Phase 2 Agent boxes -->
  <rect x="80" y="580" width="170" height="56" rx="8" fill="#fff" stroke="#059669" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="165" y="600" text-anchor="middle" font-size="10" font-weight="700" fill="#166534">Meeting Analyst</text>
  <text x="165" y="614" text-anchor="middle" font-size="8" fill="#6b7280">Transcript + Synthesis</text>
  <text x="165" y="626" text-anchor="middle" font-size="8" fill="#6b7280">→ Feature Inventory</text>

  <rect x="266" y="580" width="170" height="56" rx="8" fill="#fff" stroke="#059669" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="351" y="600" text-anchor="middle" font-size="10" font-weight="700" fill="#166534">SFCC B2B Expert</text>
  <text x="351" y="614" text-anchor="middle" font-size="8" fill="#6b7280">Feature Inventory →</text>
  <text x="351" y="626" text-anchor="middle" font-size="8" fill="#6b7280">Capability Assessment</text>

  <rect x="452" y="580" width="170" height="56" rx="8" fill="#fff" stroke="#059669" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="537" y="600" text-anchor="middle" font-size="10" font-weight="700" fill="#166534">UI Migration</text>
  <text x="537" y="614" text-anchor="middle" font-size="8" fill="#6b7280">Screen Catalog →</text>
  <text x="537" y="626" text-anchor="middle" font-size="8" fill="#6b7280">LWC Component Map</text>

  <rect x="638" y="580" width="170" height="56" rx="8" fill="#fff" stroke="#059669" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="723" y="600" text-anchor="middle" font-size="10" font-weight="700" fill="#166534">Integration/API</text>
  <text x="723" y="614" text-anchor="middle" font-size="8" fill="#6b7280">Architecture Map →</text>
  <text x="723" y="626" text-anchor="middle" font-size="8" fill="#6b7280">Integration Assessment</text>

  <rect x="824" y="580" width="170" height="56" rx="8" fill="#fff" stroke="#059669" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="909" y="600" text-anchor="middle" font-size="10" font-weight="700" fill="#166534">Data Schema</text>
  <text x="909" y="614" text-anchor="middle" font-size="8" fill="#6b7280">Architecture Map →</text>
  <text x="909" y="626" text-anchor="middle" font-size="8" fill="#6b7280">SF Object Mapping</text>

  <!-- Convergence -->
  <text x="540" y="660" text-anchor="middle" font-size="9" font-weight="600" fill="#059669">all findings converge</text>
  <line x1="165" y1="636" x2="450" y2="680" stroke="#059669" stroke-width="1" marker-end="url(#arrow-green)"/>
  <line x1="351" y1="636" x2="480" y2="680" stroke="#059669" stroke-width="1" marker-end="url(#arrow-green)"/>
  <line x1="537" y1="636" x2="540" y2="680" stroke="#059669" stroke-width="1" marker-end="url(#arrow-green)"/>
  <line x1="723" y1="636" x2="600" y2="680" stroke="#059669" stroke-width="1" marker-end="url(#arrow-green)"/>
  <line x1="909" y1="636" x2="630" y2="680" stroke="#059669" stroke-width="1" marker-end="url(#arrow-green)"/>

  <!-- Gap Analysis Agent -->
  <rect x="430" y="680" width="220" height="50" rx="10" fill="#059669" filter="url(#shadow)"/>
  <text x="540" y="702" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Gap Analysis Agent</text>
  <text x="540" y="718" text-anchor="middle" font-size="9" fill="#bbf7d0">plan approval required</text>

  <!-- Arrow to deliverable -->
  <line x1="540" y1="730" x2="540" y2="752" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- Gap Analysis Document -->
  <rect x="380" y="756" width="320" height="56" rx="10" fill="#fff" stroke="#059669" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="540" y="778" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">Gap Analysis Document</text>
  <text x="540" y="796" text-anchor="middle" font-size="9" fill="#6b7280">gap-analysis-{company-slug}-{meeting-name}.md</text>

  <!-- ===== PHASE 3 — CONFLUENCE EXPORT ===== -->
  <rect x="340" y="835" width="520" height="110" rx="10" fill="url(#phase3bg)" stroke="#c084fc" stroke-width="1.5"/>
  <text x="600" y="855" text-anchor="middle" font-size="12" font-weight="700" fill="#6b21a8" letter-spacing="1">PHASE 3 — CONFLUENCE EXPORT</text>

  <line x1="540" y1="812" x2="540" y2="833" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrow-purple)"/>

  <rect x="380" y="870" width="200" height="48" rx="8" fill="#fff" stroke="#7c3aed" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="480" y="890" text-anchor="middle" font-size="10" font-weight="700" fill="#6b21a8">Confluence Exporter</text>
  <text x="480" y="904" text-anchor="middle" font-size="8" fill="#6b7280">confluence-gap-analysis</text>

  <!-- Confluence outputs -->
  <line x1="580" y1="894" x2="630" y2="894" stroke="#7c3aed" stroke-width="1.2" marker-end="url(#arrow-purple)"/>
  <g transform="translate(640, 865)">
    <rect width="190" height="58" rx="6" fill="#f3e8ff" stroke="#c084fc"/>
    <text x="95" y="18" text-anchor="middle" font-size="9" font-weight="600" fill="#6b21a8">Confluence Deliverables</text>
    <text x="95" y="34" text-anchor="middle" font-size="8" fill="#78716c">gap-analysis-confluence-*.html</text>
    <text x="95" y="48" text-anchor="middle" font-size="8" fill="#78716c">gap-analysis-confluence-*.confluence</text>
  </g>

  <!-- Legend -->
  <g transform="translate(60, 960)">
    <rect width="450" height="54" rx="6" fill="#fff" stroke="#e5e7eb"/>
    <text x="225" y="16" text-anchor="middle" font-size="9" font-weight="600" fill="#374151">Legend</text>
    <line x1="12" y1="32" x2="42" y2="32" stroke="#d97706" stroke-width="2"/>
    <text x="50" y="36" font-size="8" fill="#6b7280">Phase 0 — Preprocessing</text>
    <line x1="160" y1="32" x2="190" y2="32" stroke="#3b82f6" stroke-width="2"/>
    <text x="198" y="36" font-size="8" fill="#6b7280">Phase 1 — Frame Analysis</text>
    <line x1="12" y1="46" x2="42" y2="46" stroke="#059669" stroke-width="2"/>
    <text x="50" y="50" font-size="8" fill="#6b7280">Phase 2 — Migration Analysis</text>
    <line x1="160" y1="46" x2="190" y2="46" stroke="#7c3aed" stroke-width="2"/>
    <text x="198" y="50" font-size="8" fill="#6b7280">Phase 3 — Confluence Export</text>
  </g>

  <!-- Option selector callout -->
  <g transform="translate(780, 960)">
    <rect width="360" height="54" rx="6" fill="#fefce8" stroke="#facc15"/>
    <text x="180" y="16" text-anchor="middle" font-size="9" font-weight="600" fill="#854d0e">Orchestration Options</text>
    <text x="180" y="30" text-anchor="middle" font-size="8" fill="#78716c">F: Full pipeline (all 4 phases) • G: Video → transcript-only (Phase 0+2)</text>
    <text x="180" y="42" text-anchor="middle" font-size="8" fill="#78716c">A-C: Start at Phase 1 (pre-extracted) • D-E: Transcript only (Phase 2)</text>
  </g>
</svg>